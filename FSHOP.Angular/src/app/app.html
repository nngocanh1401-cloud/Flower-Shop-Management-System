
<header style="background: #333; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;">
  <div class="logo">
    <a routerLink="/" style="color: pink; font-weight: bold; text-decoration: none;">🌸AHH FLOWER SHOP</a>
  </div>

  <nav style="display: flex; gap: 15px; align-items: center;">
    <a routerLink="/san-pham" style="color: white; text-decoration: none;">Cửa hàng</a>

    @if (!authService.isLoggedIn) {
      <a routerLink="/login" style="color: white;">Đăng nhập</a>
    } @else {
      <span>Chào, <b>{{ authService.currentUser?.tenDangNhap }}</b></span>
      
      @if (authService.isAdmin) {
        <a routerLink="/admin" style="background: gold; color: black; padding: 2px 5px; border-radius: 3px; font-size: 12px; text-decoration: none; margin: 0 10px;">ADMIN</a>
      }
      
      <button (click)="authService.dangXuat()" style="cursor: pointer; background: #555; color: white; border: none; padding: 5px 10px; margin-left: 10px;">Thoát</button>
    }
  </nav>
</header>

<hr style="margin: 0;">

<main class="main">
  <div class="content">
    <h1>{{ title() }}</h1> 

    <router-outlet />
  </div>
</main>
