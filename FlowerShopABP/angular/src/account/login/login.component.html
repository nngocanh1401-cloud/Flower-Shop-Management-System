<div class="login-page">

    <div class="overlay"></div>

    <div class="login-card">

        <div class="logo">
            <h1>
                <i class="fas fa-spa"></i>
                FShop
            </h1>

            <p class="shop-slogan" *ngIf="!dangDoiMatKhau">
                Fresh flowers for every moment 🌸
            </p>

            <p class="shop-slogan" *ngIf="dangDoiMatKhau">
                Cập nhật mật khẩu tài khoản
            </p>
        </div>

        <div *ngIf="thongBaoLoi" class="error-box">
            <i class="fas fa-exclamation-circle"></i>
            {{ thongBaoLoi }}
        </div>

        <div *ngIf="thongBaoThanhCong" class="success-box">
            <i class="fas fa-check-circle"></i>
            {{ thongBaoThanhCong }}
        </div>

        <div class="form-group">
            <label>Tên đăng nhập</label>

            <input type="text" [(ngModel)]="tenDangNhap" [readonly]="dangDoiMatKhau"
                [class.input-readonly]="dangDoiMatKhau" (keyup.enter)="xuLyNutChinh()"
                placeholder="Nhập tài khoản..." />
        </div>

        <div class="form-group" *ngIf="!dangDoiMatKhau">
            <label>Mật khẩu</label>

            <div class="password-wrapper">
                <input [type]="hienMatKhauDangNhap ? 'text' : 'password'" [(ngModel)]="matKhau"
                    (keyup.enter)="xuLyNutChinh()" placeholder="Nhập mật khẩu..." />

                <button type="button" class="btn-eye" (click)="batTatMatKhauDangNhap()">
                    <i class="fas" [ngClass]="hienMatKhauDangNhap ? 'fa-eye-slash' : 'fa-eye'"></i>
                </button>
            </div>
        </div>

        <div class="form-group" *ngIf="dangDoiMatKhau">
            <label>Mật khẩu cũ</label>

            <div class="password-wrapper">
                <input [type]="hienMatKhauCu ? 'text' : 'password'" [(ngModel)]="matKhauCu"
                    (keyup.enter)="xuLyNutChinh()" placeholder="Nhập mật khẩu cũ..." />

                <button type="button" class="btn-eye" (click)="batTatMatKhauCu()">
                    <i class="fas" [ngClass]="hienMatKhauCu ? 'fa-eye-slash' : 'fa-eye'"></i>
                </button>
            </div>
        </div>

        <div class="form-group" *ngIf="dangDoiMatKhau">
            <label>Mật khẩu mới</label>

            <div class="password-wrapper">
                <input [type]="hienMatKhauMoi ? 'text' : 'password'" [(ngModel)]="matKhauMoi"
                    (keyup.enter)="xuLyNutChinh()" placeholder="Nhập mật khẩu mới..." />

                <button type="button" class="btn-eye" (click)="batTatMatKhauMoi()">
                    <i class="fas" [ngClass]="hienMatKhauMoi ? 'fa-eye-slash' : 'fa-eye'"></i>
                </button>
            </div>
        </div>

        <button type="button" class="btn-login" (click)="xuLyNutChinh()">
            <i class="fas" [ngClass]="dangDoiMatKhau ? 'fa-key' : 'fa-sign-in-alt'"></i>
            {{ dangDoiMatKhau ? 'Đổi mật khẩu' : 'Đăng nhập' }}
        </button>

        <button *ngIf="dangDoiMatKhau" class="btn-back-login" (click)="quayLaiDangNhap()">
            <i class="fas fa-arrow-left"></i>
            Quay lại đăng nhập
        </button>

        <div class="login-footer">
            © 2026 Flower Shop Management System
        </div>

    </div>

</div>
