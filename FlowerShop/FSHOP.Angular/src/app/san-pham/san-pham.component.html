<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="card p-3">
    <div class="card-header-content mb-3">
        <h2 class="text-primary font-weight-bold m-0"><i class="fas fa-boxes"></i> QUẢN LÝ SẢN PHẨM</h2>

        <div class="search-group-container">
            <div class="p-inputgroup search-bar">
                <input type="text" pInputText placeholder="Tìm tên sản phẩm..." [(ngModel)]="tuKhoaTimKiem"
                    (keyup.enter)="timKiem()">
                <button type="button" pButton pRipple class="p-button-danger p-button-text clear-btn"
                    *ngIf="tuKhoaTimKiem" (click)="xoaLoc()" title="Xóa bộ lọc"><i
                        class="fa-solid fa-arrow-rotate-right"></i></button>
                <button type="button" pButton pRipple class="p-button-primary" (click)="timKiem()"
                    title="Tìm kiếm"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <div class="d-flex align-items-center ml-3 border rounded p-1 bg-light" style="gap: 8px;">
                <span class="small font-weight-bold ml-1">Lọc theo giá:</span>
                <p-inputNumber [(ngModel)]="giaMin" placeholder="Min" [style]="{'width': '90px'}"
                    inputStyleClass="form-control-sm"></p-inputNumber>

                <span class="small font-weight-bold">-</span>

                <p-inputNumber [(ngModel)]="giaMax" placeholder="Max" [style]="{'width': '90px'}"
                    inputStyleClass="form-control-sm"></p-inputNumber>

                <button type="button" pButton pRipple class="p-button-warning p-button-sm"
                    (click)="locTheoGia()"><i class="fa-solid fa-magnifying-glass"></i></button>

                <button type="button" pButton pRipple
                    class="p-button-danger p-button-text p-button-sm" *ngIf="giaMin !== null || giaMax !== null"
                    (click)="xoaLocGia()"><i class="fa-solid fa-arrow-rotate-right"></i></button>
            </div>

            <button class="btn btn-success" (click)="moDialogThem()">
                <i class="fas fa-plus-circle"></i> Thêm sản phẩm
            </button>
        </div>
    </div>

    <p-table [value]="danhSachSanPham" [columns]="cols" [showCurrentPageReport]="true"
        currentPageReportTemplate="Hiển thị {first} đến {last} của {totalRecords} sản phẩm"
        styleClass="p-datatable-gridlines p-datatable-striped">

        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngFor="let col of columns" [pSortableColumn]="col.field">
                    {{col.header}} <p-sortIcon [field]="col.field"></p-sortIcon>
                </th>
                <th class="text-center">Thao tác</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr>
                <td><span class="badge badge-secondary">{{rowData.maSp}}</span></td>
                <td class="font-weight-bold text-dark">{{rowData.tenSp}}</td>
                <td class="text-danger font-weight-bold">{{rowData.donGia | number:'1.0-0'}} đ</td>
                <td><span
                        [class]="rowData.soLuongTon > 10 ? 'text-success' : 'text-danger'">{{rowData.soLuongTon}}</span>
                </td>
                <td>{{rowData.maDm}}</td>
                <td class="text-center">
                    <button class="btn btn-outline-primary btn-sm mr-1" title="Sửa" (click)="moDialogSua(rowData)">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-outline-danger btn-sm" (click)="xoa(rowData.maSp)" title="Xóa">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center p-4">Không tìm thấy sản phẩm nào!</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [(visible)]="hienThiDialog" [style]="{width: '450px'}"
    [header]="isEditMode ? 'SỬA THÔNG TIN SẢN PHẨM' : 'THÊM SẢN PHẨM MỚI'" [modal]="true" styleClass="p-fluid">

    <ng-template pTemplate="content">
        <div class="form-group">
            <label for="maSp" class="font-weight-bold">Mã Sản Phẩm <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [(ngModel)]="sanPhamThaoTac.maSp" readonly
                style="background-color: #e9ecef; font-weight: bold; color: #dc3545;" />
        </div>

        <div class="form-group mt-3">
            <label for="tenSp" class="font-weight-bold">Tên Sản Phẩm <span class="text-danger">*</span></label>
            <input type="text" pInputText id="tenSp" [(ngModel)]="sanPhamThaoTac.tenSp" required />
        </div>

        <div class="form-group mt-3">
            <label for="maDM" class="font-weight-bold">Mã Danh Mục</label>
            <p-dropdown [options]="danhSachDanhMuc" [(ngModel)]="sanPhamThaoTac.maDm" optionLabel="tenHienThi"
                optionValue="giaTri" placeholder="-- Chọn danh mục --" [style]="{'width':'100%'}" appendTo="body">
            </p-dropdown>
        </div>

        <div class="form-row mt-3">
            <div class="col-6">
                <label for="donGia" class="font-weight-bold">Giá Bán (đ)</label>
                <p-inputNumber id="donGia" [(ngModel)]="sanPhamThaoTac.donGia" mode="decimal"></p-inputNumber>
            </div>
            <div class="col-6">
                <label for="soLuongTon" class="font-weight-bold">Tồn Kho</label>
                <p-inputNumber id="soLuongTon" [(ngModel)]="sanPhamThaoTac.soLuongTon" [showButtons]="true"
                    [min]="0"></p-inputNumber>
            </div>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple label="Hủy" class="p-button-text p-button-secondary"
            (click)="dongDialog()"></button>
        <button pButton pRipple label="Lưu" class="p-button-success"
            (click)="luuSanPham()"></button>
    </ng-template>
</p-dialog>
