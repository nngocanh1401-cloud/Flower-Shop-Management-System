<div class="wrapper admin-wrapper" [class.sidebar-collapse]="!sidebarOpen">

    <!-- NAVBAR -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <button class="nav-link btn btn-link" type="button" (click)="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
            </li>

            <li class="nav-item d-none d-sm-inline-block">
                <a routerLink="/shop" class="nav-link">Shop</a>
            </li>
        </ul>

        <ul class="navbar-nav ml-auto topbar-right">
            <li class="nav-item admin-menu-wrapper">
                <button type="button" class="admin-profile-btn" (click)="batTatMenuAdmin()">
                    <div class="admin-avatar">
                        <i class="fas fa-user"></i>
                    </div>

                    <span class="admin-name">Admin</span>

                    <i class="fas fa-chevron-down admin-arrow" [class.rotate]="hienMenuAdmin"></i>
                </button>

                <div class="admin-dropdown" *ngIf="hienMenuAdmin">
                    <button type="button" class="admin-dropdown-item" (click)="doiMatKhau()">
                        <i class="fas fa-key"></i>
                        Đổi mật khẩu
                    </button>

                    <button type="button" class="admin-dropdown-item logout" (click)="dangXuat()">
                        <i class="fas fa-sign-out-alt"></i>
                        Logout
                    </button>
                </div>
            </li>
        </ul>
    </nav>

    <!-- SIDEBAR -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a routerLink="/app/san-pham" class="brand-link">
            <i class="fas fa-seedling brand-image"></i>
            <span class="brand-text">Cái Tiệm Bán Hoa</span>
        </a>

        <div class="sidebar">
            <div class="user-panel mt-3 pb-3 mb-3 d-flex">
                <div class="image">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="info">
                    <a href="javascript:;" class="d-block">Admin</a>
                </div>
            </div>

            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column nav-flat">
                    <li class="nav-item" *ngFor="let item of menuItems">
                        <a class="nav-link" [routerLink]="item.route" [class.active]="item.isActive">
                            <i class="nav-icon" [ngClass]="item.icon"></i>
                            <p>{{ item.label }}</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- CONTENT -->
    <div class="content-wrapper">
        <section class="content pt-3 px-3">
            <router-outlet></router-outlet>
        </section>
    </div>

    <!-- FOOTER -->
    <footer class="main-footer">
    </footer>
</div>
